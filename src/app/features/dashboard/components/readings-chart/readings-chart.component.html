@if (readings()?.length) {
  <div class="readings-chart">
    <div class="readings-chart__header">
      <h2 class="readings-chart__title">Readings Trends</h2>
      <div class="readings-chart__tabs" role="group" aria-label="Select sensor">
        @for (key of sensorKeys; track key) {
          <button
            class="readings-chart__tab"
            [class.readings-chart__tab--active]="selectedSensor() === key"
            (click)="selectedSensor.set(key)"
          >
            {{ sensorConfig[key].label }}
          </button>
        }
      </div>
    </div>
    <canvas baseChart [data]="chartData()" type="line" [options]="chartOptions"> </canvas>
  </div>
}
